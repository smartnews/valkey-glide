      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"
    labels:
      - "dependencies"
      - "cargo"
      - "rust"
      - "java"

    # Enable version updates for Cargo (Rust - Python wrapper)
