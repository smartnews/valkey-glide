    # Enable version updates for Go modules
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types:
          - "patch"
