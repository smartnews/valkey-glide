    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"
    labels:
      - "dependencies"
      - "cargo"
      - "rust"

    # Enable version updates for Cargo (Rust - Java wrapper)
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/java"
